<!DOCTYPE html>
<html>
<head>
  <meta name="renderer" content="webkit">

  <meta name="keywords" content="贪吃蛇,Snake,Vue,Vuex,JavaScript">
  <meta name="format-detection" content="telephone=no"/>
  <script>;(function(){var w=parseInt(window.screen.width),s=w/640,u=navigator.userAgent.toLowerCase(),m='<meta name="viewport" content="width=640,';if(/android (\d+\.\d+)/.test(u)){if(parseFloat(RegExp.$1)>2.3)m+='minimum-scale='+s+',maximum-scale='+s+',';}else{m+='user-scalable=no,';}m+='target-densitydpi=device-dpi">';document.write(m);}());</script>
  <meta charset="UTF-8">

</head>
<body>
  <div id="root">
    <div class="load">
      <div class="loader">加载中...</div>
    </div>
  </div>
  <a href="https://game-list-arv.pages.dev" class="gp-home-btn" title="主页">🏠</a>
  <!-- 社交平台 SDK（同步加载，确保 GamePlatform 在游戏逻辑前就绪）-->
  <script>
    window.__GP_API_BASE__ = new URLSearchParams(location.search).get('api') || 'https://api.w1lkin.site';
    document.write('<script src="' + window.__GP_API_BASE__ + '/sdk.js"><\/script>');
  </script>
  <script>
    window.GamePlatform.init();
    // 硬登录门：未登录跳转门户页登录
    window.GamePlatform.mountGate({ gameId: 'greedy-snake' }).then(function () {
      window._gpReady = true;
    }).catch(function () {
      window._gpReady = true;
    });
  </script>
  <!-- built files will be auto injected -->
