<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · 分享卡片</title>
<style>
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    text-align: center; padding: 40px 16px;
    background: #9aaf7a;
  }
  canvas { border-radius: 12px; box-shadow: 0 4px 24px rgba(15,31,20,0.25); max-width: 90vw; }
  button {
    margin-top: 20px; padding: 14px 40px; font-size: 17px;
    background: #0f1f14; color: #9aaf7a; border: none; border-radius: 14px;
    cursor: pointer; font-weight: 700;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  p { color: #6d7a5b; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
<h2 style="color:#0f1f14">贪吃蛇 分享卡片</h2>
<canvas id="c"></canvas>
<p>点击下载 PNG，可作为分享预览图（og:image）</p>
<button id="dl-btn" onclick="downloadPNG()" disabled>加载中…</button>
<script>
// === 配置：部署后可填写 url 生成二维码 ===
const CONFIG = {
  url: "https://greedy-snake.w1lkin.site/",   // 部署链接；留空不显示二维码
  title: "贪吃蛇",
  subtitle: "HTML5 像素复古 · 贪吃蛇小游戏",
  features: ["⌨  键盘 / 触屏双控", "💾  本地保存最近 10 次", "🐍  越吃越长 · 越玩越快"],
  slogan: "挑战你的反应极限！",
  primaryColor: "#0f1f14",
  primaryLight: "#6d7a5b",
};

const W = 1200, H = 1600;
const canvas = document.getElementById("c");
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext("2d");

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}

// 像素小蛇 + 苹果
function drawPixelSnake() {
  const dark = '#0f1f14', grid = '#8a9a68', bg = '#9aaf7a';
  const u = 26, ox = 600 - 3 * u, oy = 470;
  const body = [[0,0],[1,0],[2,0],[2,1],[2,2],[1,2]];
  body.forEach(p => {
    ctx.fillStyle = grid;
    ctx.fillRect(ox + p[0]*u, oy + p[1]*u, u-3, u-3);
    ctx.fillStyle = dark;
    ctx.fillRect(ox + p[0]*u + 2, oy + p[1]*u + 2, u-7, u-7);
  });
  ctx.fillStyle = bg;
  ctx.fillRect(ox + 4, oy + 4, 4, 4);
  ctx.fillRect(ox + 12, oy + 4, 4, 4);
  ctx.fillStyle = grid;
  ctx.fillRect(ox + 4*u, oy + 2*u, u-3, u-3);
  ctx.fillStyle = dark;
  ctx.fillRect(ox + 4*u + 2, oy + 2*u + 2, u-7, u-7);
}

function draw(qrImg) {
  const c = CONFIG;
  // 背景渐变（橄榄灰绿）
  ctx.fillStyle = '#9aaf7a'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#9aaf7a'); g.addColorStop(1, '#8a9a68');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 装饰圆
  ctx.globalAlpha = 0.06;
  [{x:200,y:400,r:280},{x:1000,y:300,r:180},{x:1050,y:1200,r:320},{x:150,y:1300,r:160},{x:600,y:200,r:100}]
    .forEach(d => { ctx.fillStyle = c.primaryColor; ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill(); });
  // 星点
  ctx.globalAlpha = 0.22; ctx.fillStyle = c.primaryColor;
  for (let i = 0; i < 40; i++) {
    ctx.beginPath(); ctx.arc(80 + Math.random()*(W-160), 80 + Math.random()*(H-160), 1 + Math.random()*2, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 内容卡
  ctx.fillStyle = '#9aaf7a';
  ctx.shadowColor = 'rgba(15,31,20,0.2)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 8;
  rr(90, 240, W-180, H-600, 56); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = 'rgba(15,31,20,0.3)'; ctx.lineWidth = 2;
  rr(90, 240, W-180, H-600, 56); ctx.stroke();

  // 标题
  ctx.fillStyle = c.primaryColor;
  ctx.font = "bold 84px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.textAlign = 'center';
  ctx.fillText(c.title, W / 2, 410);

  // 像素小蛇
  drawPixelSnake();

  // 副标题
  ctx.fillStyle = c.primaryLight;
  ctx.font = "40px -apple-system, 'PingFang SC', sans-serif";
  ctx.fillText(c.subtitle, W / 2, 720);

  // 虚线分割
  ctx.strokeStyle = '#8a9a68'; ctx.lineWidth = 3;
  ctx.setLineDash([16, 12]);
  ctx.beginPath(); ctx.moveTo(190, 790); ctx.lineTo(W-190, 790); ctx.stroke();
  ctx.setLineDash([]);

  // 特性列表
  ctx.fillStyle = '#0f1f14';
  ctx.font = "40px -apple-system, 'PingFang SC', sans-serif";
  c.features.forEach((f, i) => ctx.fillText(f, W / 2, 880 + i * 88));

  // 标语
  ctx.fillStyle = c.primaryColor;
  ctx.font = "italic 34px 'Times New Roman', 'Songti SC', serif";
  ctx.fillText(c.slogan, W / 2, 1310);

  // 二维码（有链接才画）
  if (qrImg) {
    const qs = 280, qx = (W-qs)/2, qy = H-400;
    ctx.fillStyle = '#FFF'; rr(qx-32, qy-32, qs+64, qs+64, 40); ctx.fill();
    ctx.drawImage(qrImg, qx, qy, qs, qs);
  ctx.fillStyle = '#6d7a5b';
  ctx.font = "28px -apple-system, 'PingFang SC', sans-serif";
  ctx.fillText('扫码或长按识别 · 和朋友一起玩', W / 2, H - 48);
  }

  document.getElementById("dl-btn").disabled = false;
  document.getElementById("dl-btn").textContent = "下载 PNG";
}

// 二维码加载（失败则降级无码卡片）
const qr = new Image();
qr.crossOrigin = "anonymous";
qr.onload = () => draw(qr);
qr.onerror = () => { document.getElementById("dl-btn").disabled = false; document.getElementById("dl-btn").textContent = "下载 PNG (无二维码)"; draw(null); };
if (CONFIG.url) {
  qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=" + encodeURIComponent(CONFIG.url) + "&margin=8";
} else {
  draw(null);
}

function downloadPNG() {
  const a = document.createElement("a");
  a.download = "snake-share-card.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
}
</script>
</body>
</html>
